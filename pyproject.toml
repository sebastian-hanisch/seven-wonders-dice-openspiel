[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sevenwonders-dice-openspiel"
version = "0.1.0"
description = "7 Wonders Dice (Antoine Bauza / Repos Production) as an OpenSpiel game."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "open_spiel>=2.0.2",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest"]
ui = ["streamlit", "plotly"]

[tool.setuptools.packages.find]
where = ["src"]
